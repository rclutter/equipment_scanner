<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="HHG Scanner">
<title>HHG Scanner</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #111; color: #f0f0f0; font-family: -apple-system, Helvetica, Arial, sans-serif; font-size: 16px; }
h1 { background: #1a1a1a; padding: 14px 16px; font-size: 17px; border-bottom: 1px solid #333; }
h1 span { color: #f59e0b; }
.wrap { padding: 16px; max-width: 500px; margin: 0 auto; }
label { display: block; font-size: 13px; color: #aaa; margin-bottom: 6px; margin-top: 14px; }
select {
  display: block;
  width: 100%;
  padding: 14px 12px;
  font-size: 16px;
  background: #222;
  color: #f0f0f0;
  border: 1px solid #444;
  border-radius: 8px;
  -webkit-appearance: none;
  appearance: none;
}
select:focus { outline: none; border-color: #f59e0b; }
input[type="text"], input[type="date"], textarea {
  display: block;
  width: 100%;
  padding: 14px 12px;
  font-size: 16px;
  background: #222;
  color: #f0f0f0;
  border: 1px solid #444;
  border-radius: 8px;
  -webkit-appearance: none;
  appearance: none;
}
input:focus, textarea:focus { outline: none; border-color: #f59e0b; }
textarea { resize: vertical; min-height: 80px; }
.asset-box {
  background: #1a1000;
  border: 1px solid #7c4a00;
  border-radius: 8px;
  padding: 12px 14px;
  margin-top: 14px;
  display: none;
}
.asset-box .lbl { font-size: 11px; color: #f59e0b; text-transform: uppercase; letter-spacing: 1px; }
.asset-box .val { font-size: 22px; font-weight: 700; color: #fbbf24; letter-spacing: 1px; margin-top: 2px; }
.btn {
  display: block;
  width: 100%;
  padding: 15px;
  font-size: 17px;
  font-weight: 700;
  border: none;
  border-radius: 8px;
  margin-top: 16px;
  cursor: pointer;
  -webkit-appearance: none;
  appearance: none;
}
.btn-amber { background: #f59e0b; color: #000; }
.btn-gray { background: #333; color: #ccc; }
.btn-green { background: #16a34a; color: #fff; }
.btn:disabled { opacity: 0.4; }
.photo-zone {
  border: 2px dashed #444;
  border-radius: 8px;
  padding: 32px 16px;
  text-align: center;
  margin-top: 14px;
  position: relative;
  cursor: pointer;
}
.photo-zone input {
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  opacity: 0;
  cursor: pointer;
  font-size: 0;
}
.photo-zone img { width: 100%; border-radius: 8px; display: none; }
.photo-zone .hint { color: #777; font-size: 14px; }
.spinner { display: none; text-align: center; padding: 24px; color: #aaa; font-size: 14px; }
.spinner.show { display: block; }
.err { display: none; background: #2a0000; border: 1px solid #dc2626; border-radius: 8px; padding: 12px; color: #fca5a5; font-size: 13px; margin-top: 12px; }
.err.show { display: block; }
.section { display: none; padding-bottom: 32px; }
.section.show { display: block; }
.result-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.success-box { background: #071a0e; border: 1px solid #16a34a; border-radius: 8px; padding: 16px; text-align: center; margin-top: 14px; }
.success-box p { color: #4ade80; font-size: 16px; font-weight: 600; margin-bottom: 4px; }
.success-box small { color: #aaa; font-size: 12px; }
hr { border: none; border-top: 1px solid #333; margin: 20px 0; }
</style>
</head>
<body>

<h1>HHG <span>Nameplate Scanner</span></h1>

<!-- SECTION 1: IDENTIFY -->
<div class="section show" id="s1">
<div class="wrap">

  <label>Restaurant</label>
  <select id="sel_rest" onchange="onRest()">
    <option value="">— Select —</option>
    <option value="G23">Grill 23 &amp; Bar</option>
    <option value="BDM">Bistro du Midi</option>
    <option value="HAR">Harvest</option>
    <option value="BKS">The Banks</option>
  </select>

  <label>Location</label>
  <select id="sel_loc" onchange="onLoc()">
    <option value="">— Select restaurant first —</option>
  </select>

  <label>Equipment Type</label>
  <select id="sel_equip" onchange="onEquip()">
    <option value="">— Select location first —</option>
  </select>

  <label>Asset Number</label>
  <input type="text" id="inp_num" maxlength="3" placeholder="e.g. 001" oninput="buildId()" value="">

  <div class="asset-box" id="asset_box">
    <div class="lbl">Asset ID</div>
    <div class="val" id="asset_val">—</div>
  </div>

  <button class="btn btn-amber" id="btn_next1" onclick="goPhoto()" disabled>Next — Take Photo</button>

</div>
</div>

<!-- SECTION 2: PHOTO -->
<div class="section" id="s2">
<div class="wrap">

  <label>Step 2a — Equipment Photo <span style="color:#f59e0b;font-size:11px;">Required</span></label>
  <div class="photo-zone" id="equip_zone">
    <input type="file" id="equip_input" accept="image/*" capture="environment" onchange="onEquipPhoto()">
    <img id="equip_preview">
    <div class="hint" id="equip_hint">
      <div style="font-size:40px;margin-bottom:8px;">🏭</div>
      Take a photo of the equipment
    </div>
  </div>

  <div style="height:14px"></div>

  <label>Step 2b — Nameplate Photo <span style="color:#aaa;font-size:11px;">For AI extraction</span></label>
  <div class="photo-zone" id="photo_zone">
    <input type="file" id="photo_input" accept="image/*" capture="environment" onchange="onPhoto()">
    <img id="photo_preview">
    <div class="hint" id="photo_hint">
      <div style="font-size:40px;margin-bottom:8px;">📋</div>
      Take a photo of the nameplate
    </div>
  </div>
  <div style="text-align:center;margin:10px 0;color:#555;font-size:13px;">— or —</div>
  <button class="btn btn-gray" onclick="noNameplate()" style="background:#2a2a2a;color:#ccc;border:1px solid #444;">No Nameplate / Enter Manually</button>

  <div class="spinner" id="spinner">
    <div style="font-size:28px;margin-bottom:8px;">⏳</div>
    Reading nameplate…
  </div>

  <div class="err" id="err_box"></div>

  <button class="btn btn-amber" id="btn_extract" onclick="doExtract()" disabled>Extract Nameplate Data</button>
  <button class="btn btn-gray" onclick="goBack()">← Back</button>

</div>
</div>

<!-- SECTION 3: REVIEW -->
<div class="section" id="s3">
<div class="wrap">

  <div style="font-size:13px;color:#aaa;margin-bottom:4px;">Review and correct before saving.</div>

  <div class="result-row">
    <div>
      <label>Asset ID</label>
      <input type="text" id="r_id" readonly style="color:#fbbf24;font-weight:700;">
    </div>
    <div>
      <label>Restaurant</label>
      <input type="text" id="r_rest" readonly>
    </div>
  </div>

  <label>Location</label>
  <input type="text" id="r_loc" readonly>

  <div class="result-row">
    <div>
      <label>Manufacturer</label>
      <input type="text" id="r_mfr">
    </div>
    <div>
      <label>Equipment Type</label>
      <input type="text" id="r_type">
    </div>
  </div>

  <div class="result-row">
    <div>
      <label>Model #</label>
      <input type="text" id="r_model">
    </div>
    <div>
      <label>Serial #</label>
      <input type="text" id="r_serial">
    </div>
  </div>

  <div class="result-row">
    <div>
      <label>Install Date</label>
      <input type="date" id="r_install">
    </div>
    <div>
      <label>Warranty Exp.</label>
      <input type="date" id="r_warranty">
    </div>
  </div>

  <label>Description</label>
  <input type="text" id="r_desc">

  <label>Notes / Specs</label>
  <textarea id="r_notes"></textarea>
  <input type="hidden" id="r_equip_photo" value="">

  <div class="success-box">
    <p>Ready to export</p>
    <small>Downloads a CSV row for your Asset Inventory spreadsheet</small>
  </div>

  <button class="btn btn-green" onclick="doDownload()">⬇ Download CSV Row</button>
  <button class="btn btn-gray" onclick="doReset()">+ Scan Another</button>

</div>
</div>

<script>
var LOCS = {
  G23:["Basement prep kitchen","1st floor kitchen","2nd floor kitchen","Down bar","Up bar","Down dish room","Up front dish room","Up back dish room","Basement wine cellar","Basement futures","1st floor par room","2nd floor front par room","2nd floor back par room","Beer cooler room","Basement mechanical room","Mezzanine mechanical room","2nd floor mechanical room","10th floor mechanical","Basement electrical room 1","Basement electrical room 2","1st floor electrical room","2nd floor large electrical room","2nd floor small electrical room"],
  BDM:["Main kitchen","Down bar","Up bar","Dish room","Up wine cellar","Down wine cellar","Mechanical room","Electrical room"],
  HAR:["Main kitchen","Prep kitchen","Bar","Dish room","Wine cellar","Mechanical room","Electrical room"],
  BKS:["Main kitchen","Prep kitchen","Downstairs kitchen (inactive)","Down bar","Up bar","Down dish room","Up dish room","Down wine cellar","Up wine cellar","Mechanical room","Electrical room"]
};

var REST_NAMES = {G23:"Grill 23 & Bar",BDM:"Bistro du Midi",HAR:"Harvest",BKS:"The Banks"};

var EQUIP = [
  ["Refrigeration","REF"],["Freezer","FRZ"],["Ice Machine","ICE"],
  ["Oven / Range","OVN"],["Fryer","FRY"],["Grill / Broiler","GRL"],
  ["Dishwasher","DWH"],["Heat Pump","HP"],["Mixer","MIX"],
  ["Makeup Air Unit","MAU"],["Exhaust Fan","EXF"],["Grease Trap","GT"],
  ["Pollution Control Unit","PCU"],["Pump","PMP"],["Water Heater","WTR"],
  ["Electrical Panel","ELC"],["Bar Equipment","BAR"],["Miscellaneous","MSC"]
];

var usedNums = {};
var photoB64 = null;
var equipB64 = null;

function checkBothPhotos() {
  var ready = equipB64 !== null;
  document.getElementById('btn_extract').disabled = !ready;
  if (ready && !photoB64) {
    document.getElementById('btn_extract').innerText = 'Skip Nameplate — Enter Manually';
    document.getElementById('btn_extract').style.background = '#444';
    document.getElementById('btn_extract').style.color = '#ccc';
  } else if (ready && photoB64) {
    document.getElementById('btn_extract').innerText = 'Extract Nameplate Data';
    document.getElementById('btn_extract').style.background = '#f59e0b';
    document.getElementById('btn_extract').style.color = '#000';
  }
}

function onEquipPhoto() {
  var file = document.getElementById('equip_input').files[0];
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function(e) {
    equipB64 = e.target.result.split(',')[1];
    document.getElementById('equip_preview').src = e.target.result;
    document.getElementById('equip_preview').style.display = 'block';
    document.getElementById('equip_hint').style.display = 'none';
    document.getElementById('equip_zone').classList.add('has-photo');
    checkBothPhotos();
  };
  reader.readAsDataURL(file);
}

function onRest() {
  var rest = document.getElementById('sel_rest').value;
  var loc = document.getElementById('sel_loc');
  var eq = document.getElementById('sel_equip');

  loc.innerHTML = '<option value="">— Select location —</option>';
  eq.innerHTML = '<option value="">— Select location first —</option>';
  document.getElementById('inp_num').value = '';

  if (rest && LOCS[rest]) {
    for (var i = 0; i < LOCS[rest].length; i++) {
      var o = document.createElement('option');
      o.value = LOCS[rest][i];
      o.text = LOCS[rest][i];
      loc.appendChild(o);
    }
  }
  buildId();
}

function onLoc() {
  var eq = document.getElementById('sel_equip');
  eq.innerHTML = '<option value="">— Select type —</option>';
  document.getElementById('inp_num').value = '';

  if (document.getElementById('sel_loc').value) {
    for (var i = 0; i < EQUIP.length; i++) {
      var o = document.createElement('option');
      o.value = EQUIP[i][0];
      o.text = EQUIP[i][0];
      eq.appendChild(o);
    }
  }
  buildId();
}

function onEquip() {
  var rest = document.getElementById('sel_rest').value;
  var eq = document.getElementById('sel_equip').value;
  var num = document.getElementById('inp_num');

  if (rest && eq) {
    var code = getCode(eq);
    var key = rest + '-' + code;
    usedNums[key] = usedNums[key] || 0;
    num.value = pad(usedNums[key] + 1);
  }
  buildId();
}

function getCode(name) {
  for (var i = 0; i < EQUIP.length; i++) {
    if (EQUIP[i][0] === name) return EQUIP[i][1];
  }
  return 'MSC';
}

function pad(n) {
  return n < 10 ? '00' + n : n < 100 ? '0' + n : '' + n;
}

function buildId() {
  var rest = document.getElementById('sel_rest').value;
  var loc = document.getElementById('sel_loc').value;
  var eq = document.getElementById('sel_equip').value;
  var num = document.getElementById('inp_num').value;
  var box = document.getElementById('asset_box');
  var btn = document.getElementById('btn_next1');

  if (rest && loc && eq && num) {
    var id = rest + '-' + getCode(eq) + '-' + pad(parseInt(num));
    document.getElementById('asset_val').innerText = id;
    box.style.display = 'block';
    btn.disabled = false;
  } else {
    box.style.display = 'none';
    btn.disabled = true;
  }
}

function show(id) {
  var secs = ['s1','s2','s3'];
  for (var i = 0; i < secs.length; i++) {
    document.getElementById(secs[i]).className = secs[i] === id ? 'section show' : 'section';
  }
  window.scrollTo(0,0);
}

function goPhoto() { show('s2'); }
function goBack() { show('s1'); }

function onPhoto() {
  var file = document.getElementById('photo_input').files[0];
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function(e) {
    photoB64 = e.target.result.split(',')[1];
    var img = document.getElementById('photo_preview');
    img.src = e.target.result;
    img.style.display = 'block';
    document.getElementById('photo_hint').style.display = 'none';
    document.getElementById('btn_extract').disabled = !equipB64;
  checkBothPhotos();
  };
  reader.readAsDataURL(file);
}

function noNameplate() {
  var rest = document.getElementById('sel_rest').value;
  var eq = document.getElementById('sel_equip').value;
  var num = document.getElementById('inp_num').value;
  var id = rest + '-' + getCode(eq) + '-' + pad(parseInt(num));
  var key = rest + '-' + getCode(eq);
  usedNums[key] = Math.max(usedNums[key] || 0, parseInt(num));
  document.getElementById('r_id').value = id;
  if (equipB64) {
    document.getElementById('equip_thumb_img').src = 'data:image/jpeg;base64,' + equipB64;
    document.getElementById('equip_photo_thumb').style.display = 'block';
  }
  document.getElementById('r_rest').value = REST_NAMES[rest] || rest;
  document.getElementById('r_loc').value = document.getElementById('sel_loc').value;
  document.getElementById('r_type').value = eq;
  document.getElementById('r_mfr').value = '';
  document.getElementById('r_model').value = '';
  document.getElementById('r_serial').value = '';
  document.getElementById('r_desc').value = '';
  document.getElementById('r_notes').value = 'No nameplate — data entered manually';
  document.getElementById('r_equip_photo').value = equipB64 ? 'Captured' : '';
  show('s3');
}

function doExtract() {
  if (!equipB64) return;
  if (!photoB64) { noNameplate(); return; }
  document.getElementById('btn_extract').style.display = 'none';
  document.getElementById('spinner').className = 'spinner show';
  document.getElementById('err_box').className = 'err';

  var prompt = 'Analyze this equipment nameplate photo. Return ONLY a JSON object with these keys: manufacturer, model, serial, description, equipmentType (one of: Refrigeration/Freezer/Ice Machine/Oven-Range/Fryer/Grill-Broiler/Dishwasher/Heat Pump/Exhaust Hood-Fan/Pump/Water Heater/Electrical Panel/Bar Equipment/Miscellaneous), notes (voltage amps BTU etc comma separated), installYear (4 digits or empty). Empty string if not visible. JSON only, no other text.';

  fetch('https://restless-snow-8f29.rclutter.workers.dev/', {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({
      model: 'claude-sonnet-4-5',
      max_tokens: 800,
      messages: [{
        role: 'user',
        content: [
          {type:'image', source:{type:'base64', media_type:'image/jpeg', data: photoB64}},
          {type:'text', text: prompt}
        ]
      }]
    })
  })
  .then(function(res) {
    return res.text(); // Get raw text first, not JSON
  })
  .then(function(rawText) {
    var data;
    try {
      data = JSON.parse(rawText);
    } catch(e) {
      throw new Error('Worker returned non-JSON: ' + rawText.slice(0, 300));
    }
    if (!data) throw new Error('Empty response');
    if (data.error) throw new Error('API error: ' + (data.error.message || JSON.stringify(data.error)));
    if (!data.content || !Array.isArray(data.content) || data.content.length === 0) {
      throw new Error('No content array. Full response: ' + JSON.stringify(data).slice(0, 300));
    }
    var text = '';
    for (var i = 0; i < data.content.length; i++) {
      if (data.content[i].type === 'text') { text = data.content[i].text; break; }
    }
    if (!text) throw new Error('No text block found in content');
    var s = text.indexOf('{');
    var e = text.lastIndexOf('}');
    if (s === -1 || e === -1) throw new Error('No JSON object in response: ' + text.slice(0, 200));
    var obj = JSON.parse(text.slice(s, e+1));
    fillReview(obj);
  })
  .catch(function(err) {
    document.getElementById('spinner').className = 'spinner';
    document.getElementById('btn_extract').style.display = 'block';
    var eb = document.getElementById('err_box');
    eb.innerText = 'Error: ' + err.message;
    eb.className = 'err show';
  });
}

function fillReview(obj) {
  var rest = document.getElementById('sel_rest').value;
  var eq = document.getElementById('sel_equip').value;
  var num = document.getElementById('inp_num').value;
  var id = rest + '-' + getCode(eq) + '-' + pad(parseInt(num));

  var key = rest + '-' + getCode(eq);
  usedNums[key] = Math.max(usedNums[key] || 0, parseInt(num));

  document.getElementById('r_id').value = id;
  document.getElementById('r_rest').value = REST_NAMES[rest] || rest;
  document.getElementById('r_loc').value = document.getElementById('sel_loc').value;
  document.getElementById('r_mfr').value = obj.manufacturer || '';
  document.getElementById('r_type').value = obj.equipmentType || eq;
  document.getElementById('r_model').value = obj.model || '';
  document.getElementById('r_serial').value = obj.serial || '';
  document.getElementById('r_desc').value = obj.description || '';
  document.getElementById('r_notes').value = obj.notes || '';
  document.getElementById('r_equip_photo').value = equipB64 ? 'Captured' : '';
  if (obj.installYear && obj.installYear.length === 4) {
    document.getElementById('r_install').value = obj.installYear + '-01-01';
  }

  document.getElementById('spinner').className = 'spinner';
  show('s3');
}

function doDownload() {
  var fields = [
    document.getElementById('r_id').value,
    document.getElementById('r_rest').value,
    document.getElementById('r_loc').value,
    document.getElementById('r_type').value,
    document.getElementById('r_desc').value,
    document.getElementById('r_mfr').value,
    document.getElementById('r_model').value,
    document.getElementById('r_serial').value,
    document.getElementById('r_install').value,
    document.getElementById('r_warranty').value,
    'Good',
    document.getElementById('r_notes').value,
    '', 'Yes'
  ];
  var hdr = 'Asset ID,Restaurant,Location,Equipment Type,Description,Manufacturer,Model #,Serial #,Install Date,Warranty Exp.,Condition,Notes,Photo,Active?';
  var row = fields.map(function(f){ return '"' + (f||'').split('"').join('""') + '"'; }).join(',');
  var blob = new Blob([hdr + '\n' + row], {type:'text/csv'});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = (document.getElementById('r_id').value || 'asset') + '.csv';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function doReset() {
  photoB64 = null;
  equipB64 = null;
  document.getElementById('sel_rest').value = '';
  document.getElementById('sel_loc').innerHTML = '<option value="">— Select restaurant first —</option>';
  document.getElementById('sel_equip').innerHTML = '<option value="">— Select location first —</option>';
  document.getElementById('inp_num').value = '';
  document.getElementById('asset_box').style.display = 'none';
  document.getElementById('btn_next1').disabled = true;
  document.getElementById('photo_preview').style.display = 'none';
  document.getElementById('photo_preview').src = '';
  document.getElementById('photo_hint').style.display = 'block';
  document.getElementById('equip_preview').style.display = 'none';
  document.getElementById('equip_preview').src = '';
  document.getElementById('equip_hint').style.display = 'block';
  document.getElementById('equip_zone').classList.remove('has-photo');
  document.getElementById('equip_photo_thumb').style.display = 'none';
  document.getElementById('btn_extract').disabled = true;
  document.getElementById('btn_extract').innerText = 'Extract Nameplate Data';
  document.getElementById('btn_extract').style.background = '#f59e0b';
  document.getElementById('btn_extract').style.color = '#000';
  document.getElementById('btn_extract').style.display = 'block';
  document.getElementById('err_box').className = 'err';
  show('s1');
}
</script>
</body>
</html>
